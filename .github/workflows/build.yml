name: Build Android TV APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "domains.json"
      - ".github/workflows/update-domain.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FreeStream APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Release Signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "RELEASE_STORE_FILE=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Test, Lint and Build Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace

      - name: Extract App Version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare APK for Distribution
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/release/app-release.apk "release_apks/FreeStream-v${{ steps.version.outputs.version }}-release.apk"
          ls -la release_apks/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeStream-AndroidTV-APK
          path: release_apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "FreeStream v${{ steps.version.outputs.version }} (Android TV)"
          body: |
            ## FreeStream v${{ steps.version.outputs.version }} - Android TV Edition 🚀

            APK pronto per l'installazione su Smart TV, Fire TV Stick, Google TV e Android TV Box.

            ### Caratteristiche principali:
            - **Risoluzione Automatica del Dominio**: rileva all'avvio l'indirizzo funzionante e aggiornato.
            - **Navigazione Ottimizzata per Telecomando (D-Pad)**: Spatial Navigation fluida con focus visivo cyan e zoom sulle locandine dei film/serie.
            - **Controlli Video Integrati**: supporto ai tasti Play/Pause fisici, avanzamento/riavvolgimento di 10s e uscita a schermo intero.
            - **Ad-Block & Anti-Popup**: navigazione pulita senza tab pubblicitari o redirect malevoli.
            - **Modalità Mouse Virtuale**: premi il tasto Menu per muovere il puntatore su elementi specifici.
            - **Icona e Banner 16:9 per Android TV**: grafica dedicata per la schermata home di Android TV.
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
